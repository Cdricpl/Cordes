# Publication sur Netlify : le dossier site/ est généré par build.js.
[build]
  command = "node build.js --site"
  publish = "site"

# le service worker doit toujours être relu, sinon les mises à jour n'arrivent pas
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
